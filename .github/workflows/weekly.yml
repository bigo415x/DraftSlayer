name: Weekly update

# Rebuilds week.js and refreshes injuries on a schedule, then commits the result.
# Uses the workflow's own GITHUB_TOKEN — no personal access token involved.
# GitHub Pages redeploys automatically on the push.

on:
  schedule:
    # Cron is UTC. Pacific is UTC-7 (PDT) through early November, UTC-8 after -
    # these times drift an hour once PST kicks in.
    - cron: "0 15 * * 2"    # Tuesday   8:00 AM PT
    - cron: "0 15 * * 3"    # Wednesday 8:00 AM PT
    - cron: "15 23 * * 4"   # Thursday  4:15 PM PT — 1hr before TNF kickoff (5:15 PM PT)
    - cron: "0 15 * * 5"    # Friday    8:00 AM PT
    - cron: "0 15 * * 6"    # Saturday  8:00 AM PT
    - cron: "0 16 * * 0"    # Sunday    9:00 AM PT — 1hr before the early slate (10:00 AM PT)
    - cron: "15 23 * * 1"   # Monday    4:15 PM PT — 1hr before MNF kickoff (5:15 PM PT)
  workflow_dispatch:       # "Run workflow" button in the Actions tab, any time

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh injury designations
        run: python refresh_injuries.py

      - name: Build week.js
        run: python weekly.py

      - name: Commit if anything changed
        # artifact.html is gitignored (a local build for the Claude artifact mirror); never add it here
        run: |
          git config user.name "weekly-bot"
          git config user.email "weekly-bot@users.noreply.github.com"
          git add data.js week.js
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Weekly update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
